<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberPong - Futuristic Arcade Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #080914;
      --neon-cyan: #00f3ff;
      --neon-magenta: #ff0055;
      --neon-gold: #ffb700;
      --glass-bg: rgba(15, 23, 42, 0.75);
      --glass-border: rgba(0, 243, 255, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Rajdhani', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(0, 243, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(255, 0, 85, 0.08) 0%, transparent 40%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .header {
      text-align: center;
      margin-bottom: 12px;
      z-index: 10;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 4px;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
    }

    .game-container {
      position: relative;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      box-shadow: 
        0 0 30px rgba(0, 243, 255, 0.15),
        inset 0 0 20px rgba(0, 0, 0, 0.5);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    canvas {
      background: #04050a;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.8);
      display: block;
      cursor: crosshair;
    }

    .controls-panel {
      margin-top: 16px;
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .btn {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
      background: linear-gradient(135deg, rgba(0, 243, 255, 0.2), rgba(0, 243, 255, 0.05));
      border: 1px solid var(--neon-cyan);
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
    }

    .btn:hover {
      background: linear-gradient(135deg, rgba(0, 243, 255, 0.4), rgba(0, 243, 255, 0.15));
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }

    select {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--neon-cyan);
      padding: 10px 16px;
      border-radius: 8px;
      outline: none;
      cursor: pointer;
    }

    .instructions {
      margin-top: 12px;
      font-size: 0.9rem;
      color: #94a3b8;
      text-align: center;
    }

    .key {
      display: inline-block;
      padding: 2px 6px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      color: var(--neon-cyan);
    }

    /* Modal overlay */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(8, 9, 20, 0.85);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      opacity: 1;
      transition: opacity 0.3s ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .overlay-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      font-weight: 900;
      margin-bottom: 8px;
      color: var(--neon-gold);
      text-shadow: 0 0 15px rgba(255, 183, 0, 0.5);
    }

    .overlay-subtitle {
      font-size: 1.1rem;
      color: #cbd5e1;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>CYBER PONG</h1>
  </div>

  <div class="game-container">
    <canvas id="pongCanvas" width="800" height="500"></canvas>

    <div class="controls-panel">
      <button class="btn" id="startBtn">START / PAUSE</button>
      <button class="btn" id="resetBtn">RESET GAME</button>
      <select id="modeSelect">
        <option value="ai-easy">Mode: vs AI (Easy)</option>
        <option value="ai-medium" selected>Mode: vs AI (Medium)</option>
        <option value="ai-hard">Mode: vs AI (Hard)</option>
        <option value="ai-god">Mode: vs AI (Impossible)</option>
        <option value="pvp">Mode: 2 Player Local</option>
      </select>
    </div>

    <div class="instructions">
      Player 1: <span class="key">W</span> / <span class="key">S</span> or Mouse Drag &nbsp;|&nbsp; Player 2: <span class="key">↑</span> / <span class="key">↓</span> &nbsp;|&nbsp; Space: Pause
    </div>

    <div class="overlay" id="overlay">
      <div class="overlay-title" id="overlayTitle">READY TO PLAY?</div>
      <div class="overlay-subtitle" id="overlaySubtitle">First to 7 points wins!</div>
      <button class="btn" id="overlayBtn">PRESS SPACE TO PLAY</button>
    </div>
  </div>

  <script>
    // Web Audio Synthesizer for Retro Sound Effects
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(freq, type, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    const sounds = {
      hitPaddle: () => playSound(440, 'triangle', 0.08),
      hitWall: () => playSound(220, 'sine', 0.06),
      score: () => playSound(660, 'sine', 0.25),
      win: () => {
        playSound(523.25, 'square', 0.15);
        setTimeout(() => playSound(659.25, 'square', 0.15), 150);
        setTimeout(() => playSound(783.99, 'square', 0.3), 300);
      }
    };

    // Canvas Setup
    const canvas = document.getElementById('pongCanvas');
    const ctx = canvas.getContext('2d');

    // Game Variables
    const PADDLE_WIDTH = 12;
    const PADDLE_HEIGHT = 90;
    const BALL_RADIUS = 8;
    const WINNING_SCORE = 7;

    let isRunning = false;
    let isPaused = true;

    const player1 = {
      x: 20,
      y: canvas.height / 2 - PADDLE_HEIGHT / 2,
      width: PADDLE_WIDTH,
      height: PADDLE_HEIGHT,
      score: 0,
      dy: 0,
      speed: 8,
      color: '#00f3ff'
    };

    const player2 = {
      x: canvas.width - 20 - PADDLE_WIDTH,
      y: canvas.height / 2 - PADDLE_HEIGHT / 2,
      width: PADDLE_WIDTH,
      height: PADDLE_HEIGHT,
      score: 0,
      dy: 0,
      speed: 8,
      color: '#ff0055'
    };

    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: BALL_RADIUS,
      speed: 6,
      dx: 5,
      dy: 3,
      trail: []
    };

    const particles = [];

    function createParticles(x, y, color) {
      for (let i = 0; i < 15; i++) {
        particles.push({
          x,
          y,
          dx: (Math.random() - 0.5) * 6,
          dy: (Math.random() - 0.5) * 6,
          radius: Math.random() * 3 + 1,
          color,
          alpha: 1
        });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.dx;
        p.y += p.dy;
        p.alpha -= 0.03;
        if (p.alpha <= 0) particles.splice(i, 1);
      }
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    // Input Handling
    const keys = {};

    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      }
    });

    window.addEventListener('keyup', e => {
      keys[e.key] = false;
    });

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const mouseY = e.clientY - rect.top;
      player1.y = mouseY - player1.height / 2;
    });

    // AI Logic
    function updateAI() {
      const mode = document.getElementById('modeSelect').value;
      if (mode === 'pvp') return;

      let speedFactor = 0.08;
      if (mode === 'ai-easy') speedFactor = 0.05;
      if (mode === 'ai-medium') speedFactor = 0.09;
      if (mode === 'ai-hard') speedFactor = 0.14;
      if (mode === 'ai-god') speedFactor = 0.25;

      const targetY = ball.y - player2.height / 2;
      player2.y += (targetY - player2.y) * speedFactor;
    }

    function resetBall(direction = 1) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.speed = 6;
      ball.dx = direction * ball.speed;
      ball.dy = (Math.random() - 0.5) * 6;
      ball.trail = [];
    }

    function update() {
      if (isPaused) return;

      // Move Player 1
      if (keys['w'] || keys['W']) player1.y -= player1.speed;
      if (keys['s'] || keys['S']) player1.y += player1.speed;

      // Move Player 2 in PVP mode
      const mode = document.getElementById('modeSelect').value;
      if (mode === 'pvp') {
        if (keys['ArrowUp']) player2.y -= player2.speed;
        if (keys['ArrowDown']) player2.y += player2.speed;
      } else {
        updateAI();
      }

      // Constrain Paddles inside canvas
      player1.y = Math.max(10, Math.min(canvas.height - player1.height - 10, player1.y));
      player2.y = Math.max(10, Math.min(canvas.height - player2.height - 10, player2.y));

      // Move Ball
      ball.x += ball.dx;
      ball.y += ball.dy;

      // Ball trail
      ball.trail.push({ x: ball.x, y: ball.y });
      if (ball.trail.length > 8) ball.trail.shift();

      // Top / Bottom Wall Collision
      if (ball.y - ball.radius <= 0 || ball.y + ball.radius >= canvas.height) {
        ball.dy = -ball.dy;
        sounds.hitWall();
        createParticles(ball.x, ball.y, '#ffffff');
      }

      // Paddle Collisions
      let paddle = (ball.x < canvas.width / 2) ? player1 : player2;

      if (
        ball.x - ball.radius < paddle.x + paddle.width &&
        ball.x + ball.radius > paddle.x &&
        ball.y + ball.radius > paddle.y &&
        ball.y - ball.radius < paddle.y + paddle.height
      ) {
        sounds.hitPaddle();
        createParticles(ball.x, ball.y, paddle.color);

        // Calculate bounce angle based on hit location on paddle
        const collidePoint = ball.y - (paddle.y + paddle.height / 2);
        const angleRad = (collidePoint / (paddle.height / 2)) * (Math.PI / 4);

        const direction = (ball.x < canvas.width / 2) ? 1 : -1;
        ball.speed = Math.min(ball.speed + 0.5, 14);
        ball.dx = direction * ball.speed * Math.cos(angleRad);
        ball.dy = ball.speed * Math.sin(angleRad);
      }

      // Score Points
      if (ball.x - ball.radius <= 0) {
        player2.score++;
        sounds.score();
        createParticles(ball.x, ball.y, player2.color);
        checkWinner();
        resetBall(1);
      } else if (ball.x + ball.radius >= canvas.width) {
        player1.score++;
        sounds.score();
        createParticles(ball.x, ball.y, player1.color);
        checkWinner();
        resetBall(-1);
      }

      updateParticles();
    }

    function checkWinner() {
      if (player1.score >= WINNING_SCORE || player2.score >= WINNING_SCORE) {
        isPaused = true;
        sounds.win();
        const winner = player1.score >= WINNING_SCORE ? 'PLAYER 1 WINS!' : 'PLAYER 2 / AI WINS!';
        document.getElementById('overlayTitle').innerText = winner;
        document.getElementById('overlaySubtitle').innerText = `${player1.score} - ${player2.score}`;
        document.getElementById('overlayBtn').innerText = 'PLAY AGAIN';
        document.getElementById('overlay').classList.remove('hidden');
      }
    }

    function draw() {
      // Clear screen
      ctx.fillStyle = '#04050a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center Line
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
      ctx.setLineDash([10, 10]);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Scores
      ctx.font = '700 3rem Orbitron';
      ctx.fillStyle = 'rgba(0, 243, 255, 0.4)';
      ctx.fillText(player1.score, canvas.width / 4, 70);

      ctx.fillStyle = 'rgba(255, 0, 85, 0.4)';
      ctx.fillText(player2.score, (canvas.width / 4) * 3, 70);

      // Draw Paddles
      [player1, player2].forEach(p => {
        ctx.save();
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 15;
        ctx.shadowColor = p.color;
        ctx.fillRect(p.x, p.y, p.width, p.height);
        ctx.restore();
      });

      // Draw Ball Trail
      ball.trail.forEach((t, index) => {
        ctx.save();
        ctx.fillStyle = `rgba(0, 243, 255, ${ (index + 1) / ball.trail.length * 0.4 })`;
        ctx.beginPath();
        ctx.arc(t.x, t.y, ball.radius * (index / ball.trail.length), 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Draw Ball
      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.shadowBlur = 20;
      ctx.shadowColor = '#00f3ff';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      drawParticles();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    function togglePlay() {
      isPaused = !isPaused;
      const overlay = document.getElementById('overlay');
      if (isPaused) {
        document.getElementById('overlayTitle').innerText = 'PAUSED';
        document.getElementById('overlaySubtitle').innerText = 'Press Space or click to resume';
        document.getElementById('overlayBtn').innerText = 'RESUME GAME';
        overlay.classList.remove('hidden');
      } else {
        overlay.classList.add('hidden');
      }
    }

    function resetGame() {
      player1.score = 0;
      player2.score = 0;
      player1.y = canvas.height / 2 - PADDLE_HEIGHT / 2;
      player2.y = canvas.height / 2 - PADDLE_HEIGHT / 2;
      resetBall();
      isPaused = true;
      document.getElementById('overlayTitle').innerText = 'CYBER PONG';
      document.getElementById('overlaySubtitle').innerText = 'First to 7 points wins!';
      document.getElementById('overlayBtn').innerText = 'START GAME';
      document.getElementById('overlay').classList.remove('hidden');
    }

    // Event Listeners
    document.getElementById('startBtn').addEventListener('click', togglePlay);
    document.getElementById('resetBtn').addEventListener('click', resetGame);
    document.getElementById('overlayBtn').addEventListener('click', () => {
      if (player1.score >= WINNING_SCORE || player2.score >= WINNING_SCORE) {
        resetGame();
      }
      togglePlay();
    });

    resetGame();
    gameLoop();
  </script>
</body>
</html>
